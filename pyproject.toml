[project]
name = "dinner-crew"
version = "0.1.0"
description = "Toy CrewAI example: three agents, three recommender techniques, one dinner plan."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai>=1.15",
    "implicit>=0.7.3",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "rectools-lightfm>=1.17.3",
    "scikit-surprise>=1.1.5",
    "streamlit>=1.67.0",
]

[project.scripts]
dinner-crew = "dinner_crew.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinner_crew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:crewai.*"]
