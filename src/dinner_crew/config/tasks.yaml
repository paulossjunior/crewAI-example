recommend_dish:
  description: >
    Use a ferramenta food_lightfm_recommender com preferences={preferences_list},
    restrictions={restrictions_list} e user_id={user_id_json}. {dish_instruction}
    Informe os 3 pratos retornados (com score) e indique o prato escolhido, sua culinária e a
    justificativa da ferramenta. Repasse qualquer "warning".
  expected_output: >
    Prato escolhido (nome exato e culinária), 3 candidatos com score e justificativa mencionando
    "LightFM (modelo híbrido)".
  agent: food_sommelier

pair_wine:
  description: >
    Use a ferramenta wine_implicit_recommender com dish_name = nome exato do prato escolhido na
    tarefa anterior e price="{price}". Escolha o melhor vinho e explique a justificativa da
    ferramenta (histórico de pedidos, pratos parecidos). Repasse qualquer "warning".
  expected_output: >
    Vinho escolhido (nome exato, tipo, corpo, preço), alternativas e justificativa mencionando
    "implicit (ALS, feedback implícito)".
  agent: wine_sommelier
  context:
    - recommend_dish

recommend_restaurant_and_compose_plan:
  description: >
    Use a ferramenta restaurant_surprise_recommender com cuisine = culinária do prato escolhido,
    city="{city}" e user_id={user_id_json}. Depois monte o plano de jantar final em markdown, em
    português, com exatamente estas seções: "## 🍽️ Prato", "## 🍷 Vinho", "## 📍 Restaurante".
    Cada seção traz o item escolhido, as alternativas e uma linha "**Recomendador:** ..." nomeando
    a biblioteca e a técnica (LightFM — híbrido; implicit — ALS com feedback implícito;
    Surprise — KNN com notas explícitas) e explicando por que ela levou à sugestão. Inclua avisos
    ("warning") das ferramentas. Cite apenas itens retornados pelas ferramentas.
  expected_output: >
    Plano de jantar em markdown com as três seções e o recomendador de cada uma.
  agent: concierge
  context:
    - recommend_dish
    - pair_wine
